name: CI - Build,Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs: 
  ci:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Restore NuGet packages
      run: nuget restore PartsUnlimited.sln
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build & Publish Website
      run: |
        msbuild `
          src\PartsUnlimitedWebsite\PartsUnlimitedWebsite.csproj `
          /p:Configuration=Release `
          /p:Platform=AnyCPU `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:PublishUrl=..\..\artifact `
          /p:DeployTarget=WebPublish
            
    - name: Build Test Projects
      run: |
        msbuild `
          test\PartsUnlimited.UnitTests\PartsUnlimited.UnitTests.csproj `
          /p:Configuration=Release `
          /p:Platform=AnyCPU
      continue-on-error: true
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Debug Artifact Content
      shell: cmd
      run: |
        echo "=== Checking artifact structure ==="
        dir artifact /s /b | findstr /i "\.png \.jpg \.jpeg" | head -20
        echo.
        echo "=== Checking for Images folder ==="
        if exist "artifact\Images" (
          echo Images folder exists
          dir "artifact\Images" /b
          echo.
          echo Total images: 
          dir "artifact\Images" /b | find /c /v ""
        ) else (
          echo WARNING: No Images folder in artifact!
          echo Available folders:
          dir artifact /ad /b
        )
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: PartsUnlimited-Build
        path: artifact
