name: SAST Quality Gate
on: [pull_request]

jobs:
  sast-gate:
    runs-on: ubuntu-latest
    steps:
    - name: Download CodeQL Results
      uses: actions/download-artifact@v4
      with:
        name: codeql-results
        path: ./codeql-results
        
    - name: Check Security Threshold
      run: |
        # Parse SARIF files and check thresholds
        python -c "
        import json
        import sys
        
        critical = 0
        high = 0
        
        # Load SARIF results
        with open('./codeql-results/results.sarif') as f:
            data = json.load(f)
            
        for run in data.get('runs', []):
            for result in run.get('results', []):
                severity = result.get('level', 'warning')
                if severity == 'error':
                    critical += 1
                elif severity == 'warning':
                    high += 1
        
        print(f'Found: {critical} critical, {high} high severity issues')
        
        # Quality gate: Fail if critical > 0 or high > 5
        if critical > 0:
            print('❌ FAIL: Critical security issues found')
            sys.exit(1)
        elif high > 5:
            print('❌ FAIL: Too many high severity issues')
            sys.exit(1)
        else:
            print('✅ PASS: Security quality gate met')
        "
        
    - name: Comment on PR
      if: failure()
      run: |
        gh pr comment ${{ github.event.pull_request.number }} \
          --body "## 🔴 SECURITY QUALITY GATE FAILED
        
        This PR contains security vulnerabilities that must be fixed before merging.
        
        **Next Steps:**
        1. Review CodeQL findings
        2. Fix critical/high severity issues
        3. Push fixes
        4. SAST will re-run automatically
        
        Required reviewers: @security-team"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
